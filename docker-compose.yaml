services:

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD:  cinema_root_password
      MYSQL_DATABASE: cinema_db
      MYSQL_USER: cinema_user
      MYSQL_PASSWORD: cinema_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - test_network


  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      MYSQL_USER: cinema_user
      MYSQL_PASSWORD: cinema_password

    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - test_network

volumes:
  mysql_data:

networks:
  test_network:
